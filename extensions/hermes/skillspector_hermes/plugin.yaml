# Named skillspector_hermes (not skillspector) so the plugin package can never
# shadow the installed `skillspector` distribution it imports at scan time.
name: skillspector_hermes
version: 2.3.7
description: >-
  Security scanner for AI agent skills. Scan a skill, MCP server, Git repo, URL,
  zip, or local directory for vulnerabilities and malicious patterns before
  installing or trusting it, and gate installs on the returned risk verdict.
author: NVIDIA
provides_tools:
  - skillspector_scan
optional_env:
  - name: SKILLSPECTOR_MODEL
    description: >-
      Optional model override for the host LLM pass. Leave unset to use whatever
      model the Hermes agent is currently configured with.
